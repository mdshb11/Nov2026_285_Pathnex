### Jenkins pipeline CICD 
#groovy script

pipeline {
agent any
    stages {
        stage("git clone") {
            steps {
              script {
                sh "git clone url"
              }
            }
        }
        stage("test code") {
            steps {
              script {
                sh "command for test"
              }
            }
        }
        stage("build artifact") {
            steps {
              script {
                sh "mvn build"
              }
            }
        }
        stage('Build Docker Image') {
            steps {
                script {
                    docker.build('shoib-app')
                }
            }
        }
        stage('Push Docker Image') {
            steps {
                script {
                    docker.withRegistry('https://docker.io', 'docker-credentials') {
                        docker.image('shoib-app').push('latest')
                    }
                }
            }
        }
    }
}


## Gitlab pipiline for Build & Push Docker Image

stages:
  - clone
  - test
  - build_artifact
  - build_image
  - push

clone:
  stage: clone
  script:
    - git clone <repo_url>

test:
  stage: test
  script:
    - echo "Command for testing"

build_artifact:
  stage: build_artifact
  script:
    - mvn clean package

build_image:
  stage: build_image
  script:
    - docker build -t shoib-app .

push:
  stage: push
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker tag shoib-app mdshb11/shoib-app:latest
    - docker push mdshb11/shoib-app:latest


