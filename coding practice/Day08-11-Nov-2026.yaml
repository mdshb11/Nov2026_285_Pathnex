Day 08 Introduction to Docker and CI/CD Pipelines
###Ansible — Install Docker Compose

- name: install docker compose
  hosts: all
  become: yes
  tasks:
    - name: Install dependencies of docker compose
      yum:
        name: "python3-pip"
        state: present
    
    - name: Install docker-compose
      pip:
        name: docker-compose

##Terraform code for EC2 with Security Group and EBS Volume

resource "aws_security_group" "allow_ssh_http" {
  name        = "allow_ssh_http"
  description = "Allow SSH and HTTP access"
  ingress {
    from_port   = 22
    to_port     = 22
    protocol    = "tcp"
    cidr_blocks = ["0.0.0.0/0"]
  }

  ingress {
    from_port   = 80
    to_port     = 80
    protocol    = "tcp"
    cidr_blocks = ["0.0.0.0/0"]
  }
}

resource "aws_instance" "shoib_ec2" {
  ami           = "ami-asdfcasd"
  instance_type = "t3.medium"
  security_groups = [aws_security_group.allow_ssh_http.name]

  ebs_block_device {
    device_name = "/dev/sdh"
    volume_size = 30
  }
}

