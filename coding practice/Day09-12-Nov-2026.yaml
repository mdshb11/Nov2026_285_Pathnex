Day09 — Docker Integration with Jenkins & GitLab

## Ansible — Setup Docker Container for Nginx

```yaml

- name: setup docker container for Nginx
  hosts: all
  become: yes
  tasks:
    - name: Pull Nginx image
      docker_image:
        name: nginx
        source: pull
    - name: Run Nginx container
      docker_container:
        name: nginx-container
        image: nginx
        state: started
        published_ports:
          - "8080:80"

### Terraform — EC2 with Auto Scaling Group

resource "aws_launch_configuration" "example" {
  name = "example-config"
  image_id = "ami-0abcd1234abcd1234"
  instance_type = "t3.medium"
}

resource "aws_autoscaling_group" "example" {
  desired_capacity     = 2
  max_size             = 3
  min_size             = 1
  vpc_zone_identifier  = ["subnet-12345678"]
  launch_configuration = aws_launch_configuration.example.id

}       

## Kubernetes — Horizontal Pod Autoscaler (HPA)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoib-deployment
spec:
  replicas: 12
  selector:
    matchLabels:
      app: shoib-app
  template:
    metadata:
      labels:
        app: shoib-app
    spec:
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shoib-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shoib-deployment
  minReplicas: 1
  maxReplicas: 12
  targetCPUUtilizationPercentage: 50


### Jenkinsfile — Deploy to Kubernetes


pipeline {
    agent any
    stages {
        stage('Deploy to Kubernetes') {
            steps {
                script {
                    sh 'kubectl apply -f deployment.yaml'
                }
            }
        }
    }
}


##GitLab CI/CD — Deploy to Kubernetes
stages:
  - test
  - build
  - deploy

test:
  stage: test
  script:
    - echo "testing the code"

build:
  stage: build
  script:
   - echo "build the artifact"

deploy:
  stage: deploy
  script:
    - kubectl apply -f kubernetes/deployment.yaml


