Day 15 — Automation with Terraform, Ansible, and CI/CD Pipelines


# Ansible — Deploy a Web Application to Multiple Hosts

'''yaml

- name: Deploy web application to multiple hosts
  hosts: all
  become: yes
  tasks:
    - name: Copy web app files
      copy:
        src: /path/to/web/app/
        dest: /var/www/html/
    - name: Start web app service
      service:
        name: apache2
        state: started
        enabled: yes

        
# Terraform — Create EC2 with ALB (Application Load Balancer)

resource "aws_lb" "mdshoib_lb" {
  name               = "mdshoib-lb"
  internal           = false
  load_balancer_type = "application"
  security_groups    = [aws_security_group.allow_ssh_http.id]
  subnets            = [aws_subnet.public.id]
}

resource "aws_instance" "mdshoib_ec2" {
  ami             = "ami-0abcd1234abcd1334"
  instance_type   = "t2.micro"
  security_groups = [aws_security_group.allow_ssh_http.name]

  tags = {
    Name = "mdshoib-EC2"
  }
}

# Kubernetes — Helm Chart for Redis with Persistence
helm install mdshoib-redis bitnami/redis --set persistence.enabled=true --set persistence.size=8Gi

# Jenkinsfile — Multi-Environment Deployment

pipeline {
    agent any
    environment {
        IMAGE_NAME = 'mdshoib-web-app'
        DEPLOY_ENV = 'production'
    }
    stages {
        stage('Docker Build') {
            steps {
                echo 'Building Docker image...'
                docker.build("${env.IMAGE_NAME}")
            }
        }
        stage('Testing the code') {
            steps {
                echo 'Running tests...'
            }
        }
        stage('Deploy Application to Kubernetes') {
            steps {
                script {
                    if (env.DEPLOY_ENV == 'production') {
                        sh 'kubectl apply -f kubernetes/prod-deployment.yaml'
                    } else {
                        sh 'kubectl apply -f kubernetes/dev-deployment.yaml'
                    }
                }
            }
        }
    }
}

# GitLab CI/CD — Environment-Specific Deployments

stages:
  - build
  - push
  - deploy

build:
  stage: build
  script:
    - docker build -t mdshoib-web-app .

push:
  stage: push
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker push mdshoib-web-app

deploy:
  stage: deploy
  script:
    - |
      if [ "$CI_COMMIT_REF_NAME" == "main" ]; then
        kubectl apply -f kubernetes/prod-deployment.yaml
      else
        kubectl apply -f kubernetes/dev-deployment.yaml
      fi


