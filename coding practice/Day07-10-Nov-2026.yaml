        System.out.println("Hello Mr. Shoib");
    }
}

#Dockerfile

FROM openjdk:17
WORKDIR /opt/shoib/java-app
COPY hello.java .
RUN javac /opt/shoib/java-app/hello.java
CMD ["java", "-cp", "/opt/shoib/java-app", "hello"]

# Docker File
FROM openjdk:17
WORKDIR /opt/pathnex/java-app
COPY Hello.java /opt/pathnex/java-app/
RUN javac /opt/pathnex/java-app/Hello.java
CMD ["java", "-cp", "/opt/pathnex/java-app", "Hello"]

