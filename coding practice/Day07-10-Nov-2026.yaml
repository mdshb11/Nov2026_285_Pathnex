Day-07 Automating Cloud Infrastructure with Ansible  &  Terraform

#ansible script

- name: install nginx service
  hosts: all
  become: yes
  tasks:
    - name: install nginx service
      yum:
        - name: install nginx
          state: present
      copy:
          src: nginx.conf
          dest: /etc/nginx/nginx.conf
     - name: start nginx service
       service:
        - name: start nginx service
          state: started
          enable: yes

#Terraform code for Provision EC2 with IAM Role

resource "aws_iam_role" "ec2_role" {
  name               = "shoib_ec2_role"
  assume_role_policy = jsonencode({
    Version = "2026-10-11"
    Statement = [
      {
        Action = "sts:AssumeRole"
        Effect = "Allow"
        Principal = {
          Service = "ec2.amazonaws.com"
        }
      }
    ]
  })
}

resource "aws_instance" "shoib_ec2" {
  ami           = "ami-sadsfbcd1234"
  instance_type = "t2.medium"
  iam_instance_profile = aws_iam_role.ec2_role.name
  tags = {
    Name = "shoib-EC2"
  }
}

