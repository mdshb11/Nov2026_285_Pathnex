Day 12 — Scaling Applications and Automation

#### Ansible — Setup Auto-Scaling Group (ASG)

- name: Setup Autoscaling group 
  hosts: all
  become: yes
  tasks:
    - name: Create launch Configuration
      ec2_asg:
        - name: shoib-asg
          region: us-east-1
        launch_config_name: shoib-launch-config
        min_size: 1
        max_size: 5
        desired_capacity: 4
        vpc_zone_identifier: subnet-123433

## Terraform — Create a Load Balancer with EC2 Instances
resource "aws_lb" "shoib_lb" {
  name               = "shoib-lb"
  internal           = false
  load_balancer_type = "application"
  security_groups   = [aws_security_group.allow_ssh_http.id]
  subnets           = [aws_subnet.public.id]
}

resource "aws_instance" "shoib_ec2" {
  ami           = "ami-0abcd1234abcd1234"
  instance_type = "t2.micro"
  security_groups = [aws_security_group.allow_ssh_http.name]
  tags = {
    Name = "shoib-EC2"
  }
}

## Kubernetes — Horizontal Pod Autoscaler (HPA) with Load Balancer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoib-web-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shoib-web-app
  template:
    metadata:
      labels:
        app: shoib-web-app
    spec:
      containers:
        - name: web
          image: nginx
          ports:
            - containerPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shoib-web-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shoib-web-app
  minReplicas: 1
  maxReplicas: 6
  targetCPUUtilizationPercentage: 80

