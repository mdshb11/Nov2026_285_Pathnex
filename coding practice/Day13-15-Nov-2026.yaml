Day 13 — Advanced Automation with CloudFormation and CI/CD
### Ansible — Multi-Node Nginx Setup
- name: Setup nginx on multiple nodes
  hosts: all
  become: yes
  tasks:
    - name: install nginx 
      yum:
        name: nginx
        state: present
    - name: start nginx service
        service:
          name: nginx
          state: started 
          enable: yes


### Terraform — Create IAM Users and Policies


resource "aws_iam_user" "example_user" {
  name = "shoib_user"
}

resource "aws_iam_policy" "example_policy" {
  name        = "shoib-policy"
  description = "Policy for shoib application"
  policy      = jsonencode({
    Version = "2026-11-15"
    Statement = [
      {
        Action = "s3:ListBucket"
        Effect = "Allow"
        Resource = "arn:aws:s3:::shoib-bucket"
      },
    ]
  })
}


### Kubernetes — Deploy Nginx with ConfigMap and Secrets
---
apiVersion: v1
kind: ConfigMap
metadta: 
  name: nginx-config
data:
  nginx.conf: |
    server {
      listen 80;
      server_name localhost;
      location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
      }
    }

---
apiVersion: v1
kind: Secret
metadata:
  name: nginx-secret
type: Opaque
data:
  password: cGF0aG5leHBhc3M=

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoib-nginx
spec:
  replicas: 4
  selector:
    matchLabels:
      app: shoib-nginx
  template:
    metadata:
      labels:
        app: shoib-nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: nginx-config
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: nginx-secret
          secret:
            secretName: nginx-secret


### Jenkinsfile — Multi-Branch Pipeline with Docker Build
pipeline {
  agent any

  environment {
    IMAGE_NAME = "shoib-web-app"
  }

  stages {
    stage ("Docker Build") {
      steps {
        script {
          docker.build("${env.IMAGE_NAME}")
        }
      }
    }
    stage('Deploy') {
      steps {
        sh 'kubectl apply -f kubernetes/deployment.yaml'
        
      }
    }
  }
}

### GitLab CI/CD — Advanced Deployment with Helm
stages:
  - build
  - push
  - deploy

build:
  stage: build
  script:
    - docker build -t shoib-web-app .

push:
  stage: push
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker push shoib-web-app

deploy:
  stage: deploy
  script:
    - helm repo add shoib https://charts.shoib.com
    - helm install shoib-nginx shoib/nginx-ingress



